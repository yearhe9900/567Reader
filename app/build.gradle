    alias libs.plugins.android.application
    // kotlin.android 已内置在 AGP 9.0+ 中，不再需要单独声明
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.room
    alias libs.plugins.ksp
    alias libs.plugins.compose.compiler
}
apply from: 'download.gradle'

def name = "567Reader"
// 版本号遵循 Semantic Versioning 2.0.0 (https://semver.org/lang/zh-CN/)
// 格式：MAJOR.MINOR.PATCH[-prerelease]
//   MAJOR：不兼容的 API 变更
//   MINOR：向下兼容的功能性新增
//   PATCH：向下兼容的问题修正
//   prerelease：可选，alpha / beta / rc.N；正式版留空则 versionName 不含后缀
def majorVersion = 1
def minorVersion = 0
def patchVersion = 0
def stageVersion = "" // 留空 = 正式版；示例："alpha" / "beta" / "rc.1"
def version = stageVersion ? "${majorVersion}.${minorVersion}.${patchVersion}-${stageVersion}" : "${majorVersion}.${minorVersion}.${patchVersion}"
// versionCode 基于日期生成，保证单调递增且避免破坏 Configuration Cache
def versionCodeVal = 100000 + Integer.parseInt(new Date().format("yyMMdd", TimeZone.getTimeZone("GMT+8")))

android {
    compileSdk = compile_sdk_version
    namespace = 'com.qreader.reader'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    signingConfigs {
        if (project.hasProperty("RELEASE_STORE_FILE")) {
            myConfig {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }
    defaultConfig {
        applicationId "com.qreader.reader"
        minSdk 33
        targetSdk 36
        versionCode versionCodeVal
        versionName version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        project.ext.set("archivesBaseName", name + "_" + version)

        buildConfigField "String", "Cronet_Version", "\"$CronetVersion\""
        buildConfigField "String", "Cronet_Main_Version", "\"$CronetMainVersion\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.incremental"     : "true",
                        "room.expandProjection": "true",
                        "room.schemaLocation"  : "$projectDir/schemas".toString()
                ]
            }
        }
    }
    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }
    buildTypes {
        release {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            applicationIdSuffix '.release'
            if (getApplicationIdSuffix() == '.releaseA') {
                manifestPlaceholders.put("app_name", "@string/app_name_a")
            } else if (getApplicationIdSuffix() == '.releaseS') {
                manifestPlaceholders.put("app_name", "@string/app_name_s")
            } else {
                manifestPlaceholders.put("app_name", "@string/app_name")
            }

            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
        debug {
            if (project.hasProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.myConfig
            }
            manifestPlaceholders.put("app_name", "@string/app_name")

            applicationIdSuffix '.debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'cronet-proguard-rules.pro'
        }
    }
    //noinspection GrDeprecatedAPIUsage
    flavorDimensions = ['mode']
    productFlavors {
        app {
            dimension "mode"
            manifestPlaceholders.put("APP_CHANNEL_VALUE", "app")
        }
    }

    // AGP 9.0+ 使用新的 API 设置输出文件名
    // debug → 567Reader_debug.apk，release → 567Reader_release.apk
    androidComponents {
        onVariants(selector().all()) { variant ->
            val buildType = variant.buildType ?: "unknown"
            variant.outputs.forEach { output ->
                output.outputFileName.set("567Reader_${buildType}.apk")
            }
        }
    }


    room {
        schemaDirectory "$projectDir/schemas"
    }
    // 设定Room的KSP参数
    ksp {
        arg("room.incremental", "true")
        arg("room.expandProjection", "true")
        arg("room.generateKotlin", "false")
        //arg("room.schemaLocation", "$projectDir/schemas")

    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled = true
        // Sets Java compatibility
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources.excludes.add('META-INF/*')
        jniLibs.excludes.add('lib/*/librtmp-jni.so')
    }

    sourceSets {
        // Adds exported schema location as test app assets.
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    lint {
        checkDependencies = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            //options.compilerArgs << "-Xlint:unchecked"
        }
    }
    lint { //忽略string翻译缺失，后面需要翻译时去掉，todo
        disable 'MissingTranslation'
    }
}

